[package]
name = "arunaki-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Desktop Shell for Arunaki with Tauri v2"

[lib]
name = "arunaki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
arunaki-docs = { path = "../core/arunaki-docs" }
arunaki-engine = { path = "../core/arunaki-engine" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.15"
