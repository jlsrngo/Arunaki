<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    
<script type="module">
import init, * as bindings from './pdfcraft-web-81b252c29472c32d.js';
try {
  const wasm = await init({ module_or_path: './pdfcraft-web-81b252c29472c32d_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "pdfcraft:ready" }, "*");
  }
} catch (err) {
  console.error("PdfCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "pdfcraft:failed", error: String(err) }, "*");
  }
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type && (data.type === "pdfcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const blob = new Blob([data.bytes], { type: "application/pdf" });
      const file = new File([blob], data.name || "document.pdf", { type: "application/pdf" });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById("pdfcraft") || document.querySelector("canvas");
      const target = canvas || window;
      target.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
      target.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
    } catch (err) {
      console.warn("[PdfCraft] Drop dispatch error:", err);
    }
  }
});
</script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>

  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
