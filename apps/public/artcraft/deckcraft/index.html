<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  
<script type="module">
import init, * as bindings from './deckcraft-web-fab210fd8f1d65cb.js';

if (window.showSaveFilePicker) {
  window.showSaveFilePicker = async function() {
    throw new Error("fallback to anchor download");
  };
}

const origAnchorClick = HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click = function() {
  if (this.download && this.href && (this.href.startsWith("blob:") || this.href.startsWith("data:"))) {
    const filename = this.download;
    const blobUrl = this.href;
    fetch(blobUrl)
      .then((res) => res.arrayBuffer())
      .then((buf) => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "deckcraft:save",
              name: filename,
              bytes: buf,
            },
            "*"
          );
        }
      })
      .catch((err) => console.warn("[DeckCraft Host] Save export error:", err));
    return;
  }
  return origAnchorClick.apply(this, arguments);
};

function clickCanvas(x, y) {
  const canvas = document.getElementById("deckcraft_canvas") || document.querySelector("canvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const clientX = rect.left + x;
  const clientY = rect.top + y;
  const downOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 1 };
  canvas.dispatchEvent(new PointerEvent("pointerdown", downOpts));
  canvas.dispatchEvent(new MouseEvent("mousedown", downOpts));
  const upOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 0 };
  canvas.dispatchEvent(new PointerEvent("pointerup", upOpts));
  canvas.dispatchEvent(new MouseEvent("mouseup", upOpts));
  canvas.dispatchEvent(new MouseEvent("click", upOpts));
}

try {
  const wasm = await init({ module_or_path: './deckcraft-web-fab210fd8f1d65cb_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "deckcraft:ready" }, "*");
  }
} catch (err) {
  console.error("DeckCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "deckcraft:failed", error: String(err) }, "*");
  }
}

let lastEditPost = 0;
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === "s") return;
  if (["Control", "Shift", "Alt", "Meta", "CapsLock", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const now = Date.now();
  if (now - lastEditPost > 250 && window.parent && window.parent !== window) {
    lastEditPost = now;
    window.parent.postMessage({ type: "deckcraft:user-edit" }, "*");
  }
}, true);

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type === "deckcraft:trigger-save") {
    const canvas = document.getElementById("deckcraft_canvas") || document.querySelector("canvas");
    if (canvas) {
      try { canvas.focus(); } catch {}
      const ctrlDown = { key: "Control", code: "ControlLeft", keyCode: 17, which: 17, ctrlKey: true, bubbles: true, cancelable: true };
      const sDown = { key: "s", code: "KeyS", keyCode: 83, which: 83, ctrlKey: true, bubbles: true, cancelable: true };
      canvas.dispatchEvent(new KeyboardEvent("keydown", ctrlDown));
      canvas.dispatchEvent(new KeyboardEvent("keydown", sDown));
      setTimeout(() => {
        const sUp = { key: "s", code: "KeyS", keyCode: 83, which: 83, ctrlKey: true, bubbles: true, cancelable: true };
        const ctrlUp = { key: "Control", code: "ControlLeft", keyCode: 17, which: 17, ctrlKey: false, bubbles: true, cancelable: true };
        canvas.dispatchEvent(new KeyboardEvent("keyup", sUp));
        canvas.dispatchEvent(new KeyboardEvent("keyup", ctrlUp));
      }, 45);
    }
    return;
  }
  if (data.type === "deckcraft:click-save-btn") {
    clickCanvas(114, 19);
    return;
  }
  if (data.type && (data.type === "deckcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const blob = new Blob([data.bytes], { type: "application/octet-stream" });
      const file = new File([blob], data.name || "Presentation.pptx", { type: "application/octet-stream" });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById("deckcraft_canvas") || document.querySelector("canvas");
      const target = canvas || window;
      target.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
      target.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
    } catch (err) {
      console.warn("[DeckCraft] Drop dispatch error:", err);
    }
  }
});
</script>
