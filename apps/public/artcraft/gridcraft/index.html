<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
  <link rel="icon" href="./gridcraft-45f84b7721cb79a9.ico" integrity="sha384-FzBCWcgv5VqBLEPSBvyC78gOs2HMh3hKu2LSLSXU01NgL5yKLk/nHdINuu0Ztky1"/>
  
<script type="module">
import init, * as bindings from './gridcraft-web-f3f8c58ab634d6ba.js';

if (window.showSaveFilePicker) {
  window.showSaveFilePicker = async function() {
    throw new Error("fallback to anchor download");
  };
}

const origAnchorClick = HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click = function() {
  if (this.download && this.href && (this.href.startsWith("blob:") || this.href.startsWith("data:"))) {
    const filename = this.download;
    const blobUrl = this.href;
    fetch(blobUrl)
      .then((res) => res.arrayBuffer())
      .then((buf) => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "gridcraft:save",
              name: filename,
              bytes: buf,
            },
            "*"
          );
        }
      })
      .catch((err) => console.warn("[GridCraft Host] Save export error:", err));
    return;
  }
  return origAnchorClick.apply(this, arguments);
};

function clickCanvas(x, y) {
  const canvas = document.getElementById("gridcraft_canvas") || document.querySelector("canvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const clientX = rect.left + x;
  const clientY = rect.top + y;
  const downOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 1 };
  canvas.dispatchEvent(new PointerEvent("pointerdown", downOpts));
  canvas.dispatchEvent(new MouseEvent("mousedown", downOpts));
  const upOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 0 };
  canvas.dispatchEvent(new PointerEvent("pointerup", upOpts));
  canvas.dispatchEvent(new MouseEvent("mouseup", upOpts));
  canvas.dispatchEvent(new MouseEvent("click", upOpts));
}

try {
  const wasm = await init({ module_or_path: './gridcraft-web-f3f8c58ab634d6ba_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "gridcraft:ready" }, "*");
  }
} catch (err) {
  console.error("GridCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "gridcraft:failed", error: String(err) }, "*");
  }
}

let lastEditPost = 0;
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === "s") return;
  if (["Control", "Shift", "Alt", "Meta", "CapsLock", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const now = Date.now();
  if (now - lastEditPost > 250 && window.parent && window.parent !== window) {
    lastEditPost = now;
    window.parent.postMessage({ type: "gridcraft:user-edit" }, "*");
  }
}, true);

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type === "gridcraft:trigger-save") {
    const canvas = document.getElementById("gridcraft_canvas") || document.querySelector("canvas");
    if (canvas) {
      try { canvas.focus(); } catch {}
      const ctrlDown = { key: "Control", code: "ControlLeft", keyCode: 17, which: 17, ctrlKey: true, bubbles: true, cancelable: true };
      const sDown = { key: "s", code: "KeyS", keyCode: 83, which: 83, ctrlKey: true, bubbles: true, cancelable: true };
      canvas.dispatchEvent(new KeyboardEvent("keydown", ctrlDown));
      canvas.dispatchEvent(new KeyboardEvent("keydown", sDown));
      setTimeout(() => {
        const sUp = { key: "s", code: "KeyS", keyCode: 83, which: 83, ctrlKey: true, bubbles: true, cancelable: true };
        const ctrlUp = { key: "Control", code: "ControlLeft", keyCode: 17, which: 17, ctrlKey: false, bubbles: true, cancelable: true };
        canvas.dispatchEvent(new KeyboardEvent("keyup", sUp));
        canvas.dispatchEvent(new KeyboardEvent("keyup", ctrlUp));
      }, 45);
    }
    return;
  }
  if (data.type === "gridcraft:click-save-btn") {
    clickCanvas(114, 19);
    return;
  }
  if (data.type && (data.type === "gridcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
      const blob = new Blob([data.bytes], { type: mime });
      const file = new File([blob], data.name || "Spreadsheet.xlsx", { type: mime });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById("gridcraft_canvas") || document.querySelector("canvas");
      const targets = [canvas, document, window].filter(Boolean);
      for (const target of targets) {
        target.dispatchEvent(new DragEvent("dragenter", { bubbles: true, cancelable: true, dataTransfer: dt }));
        target.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
        target.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
      }
    } catch (err) {
      console.warn("[GridCraft] Drop dispatch error:", err);
    }
  }
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./gridcraft-web-f3f8c58ab634d6ba.js" crossorigin="anonymous" integrity="sha384-S2CReIDDicuJh1T0rdBXnwvrOoSBqt0f7S4oQdaRC97x9So5v+swTq2VyVGbDZCH"><link rel="preload" href="./gridcraft-web-f3f8c58ab634d6ba_bg.wasm" crossorigin="anonymous" integrity="sha384-gzUJO+hEtJ0u/vjZPKoSY26K4JSctvZAoSQPiDhKKejD7i0jq5QEpoXUwpbxtQV4" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Loading GridCraft&hellip;</div>
</body>
</html>
