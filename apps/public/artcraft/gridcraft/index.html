<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
  <link rel="icon" href="./gridcraft-45f84b7721cb79a9.ico" integrity="sha384-FzBCWcgv5VqBLEPSBvyC78gOs2HMh3hKu2LSLSXU01NgL5yKLk/nHdINuu0Ztky1"/>
  
<script type="module">
import init, * as bindings from './gridcraft-web-f3f8c58ab634d6ba.js';
try {
  const wasm = await init({ module_or_path: './gridcraft-web-f3f8c58ab634d6ba_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "gridcraft:ready" }, "*");
  }
} catch (err) {
  console.error("GridCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "gridcraft:failed", error: String(err) }, "*");
  }
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type && (data.type === "gridcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
      const blob = new Blob([data.bytes], { type: mime });
      const file = new File([blob], data.name || "Spreadsheet.xlsx", { type: mime });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById("gridcraft_canvas") || document.querySelector("canvas");
      const targets = [canvas, document, window].filter(Boolean);
      for (const target of targets) {
        target.dispatchEvent(new DragEvent("dragenter", { bubbles: true, cancelable: true, dataTransfer: dt }));
        target.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
        target.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
      }
    } catch (err) {
      console.warn("[GridCraft] Drop dispatch error:", err);
    }
  }
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./gridcraft-web-f3f8c58ab634d6ba.js" crossorigin="anonymous" integrity="sha384-S2CReIDDicuJh1T0rdBXnwvrOoSBqt0f7S4oQdaRC97x9So5v+swTq2VyVGbDZCH"><link rel="preload" href="./gridcraft-web-f3f8c58ab634d6ba_bg.wasm" crossorigin="anonymous" integrity="sha384-gzUJO+hEtJ0u/vjZPKoSY26K4JSctvZAoSQPiDhKKejD7i0jq5QEpoXUwpbxtQV4" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Loading GridCraft&hellip;</div>
</body>
</html>
