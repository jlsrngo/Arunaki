<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import init, * as bindings from './wordcraft-web-9e321acdac2ac7dc.js';

let pendingFile = null;
let hasLoadedDocument = false;
let isInDocument = false;
let openSeqTimer = null;
let retrySeqTimer = null;

// 1. Intercept Rust File Dialog (rfd) file input to immediately feed pending document without browser popup
const origInputClick = HTMLInputElement.prototype.click;
HTMLInputElement.prototype.click = function() {
  if (this.type === "file" && pendingFile) {
    try {
      const dt = new DataTransfer();
      dt.items.add(pendingFile);
      Object.defineProperty(this, "files", { value: dt.files, configurable: true, writable: true });
      this.dispatchEvent(new Event("change", { bubbles: true }));
      this.dispatchEvent(new Event("input", { bubbles: true }));
      hasLoadedDocument = true;
      isInDocument = true;
      if (openSeqTimer) clearTimeout(openSeqTimer);
      if (retrySeqTimer) clearTimeout(retrySeqTimer);
      console.log("[WordCraft Host] Successfully injected document into rfd input:", pendingFile.name);
      setTimeout(() => {
        const canvas = document.getElementById("wordcraft_canvas");
        if (canvas) canvas.classList.add("ready");
        const loading = document.getElementById("wordcraft_loading");
        if (loading) loading.style.display = "none";
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "wordcraft:document-ready" }, "*");
        }
      }, 150);
      return;
    } catch (e) {
      console.warn("[WordCraft Host] Failed to inject file into input:", e);
    }
  }
  return origInputClick.apply(this, arguments);
};

// 2. Intercept Document Save (showSaveFilePicker & anchor download) to save directly to local hard disk
if (window.showSaveFilePicker) {
  window.showSaveFilePicker = async function() {
    throw new Error("fallback to anchor download");
  };
}

const origAnchorClick = HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click = function() {
  if (this.download && this.href && (this.href.startsWith("blob:") || this.href.startsWith("data:"))) {
    const filename = this.download;
    const blobUrl = this.href;
    fetch(blobUrl)
      .then((res) => res.arrayBuffer())
      .then((buf) => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "wordcraft:save",
              name: filename,
              bytes: buf,
            },
            "*"
          );
        }
      })
      .catch((err) => console.warn("[WordCraft Host] Save export error:", err));
    return;
  }
  return origAnchorClick.apply(this, arguments);
};

// Helper: synthetic click on egui canvas
function clickCanvas(x, y) {
  const canvas = document.getElementById("wordcraft_canvas") || document.querySelector("canvas");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const clientX = rect.left + x;
  const clientY = rect.top + y;
  const downOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 1 };
  canvas.dispatchEvent(new PointerEvent("pointerdown", downOpts));
  canvas.dispatchEvent(new MouseEvent("mousedown", downOpts));
  const upOpts = { clientX, clientY, bubbles: true, cancelable: true, pointerId: 1, isPrimary: true, button: 0, buttons: 0 };
  canvas.dispatchEvent(new PointerEvent("pointerup", upOpts));
  canvas.dispatchEvent(new MouseEvent("mouseup", upOpts));
  canvas.dispatchEvent(new MouseEvent("click", upOpts));
}

try {
  const wasm = await init({ module_or_path: './wordcraft-web-9e321acdac2ac7dc_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:ready" }, "*");
  }
} catch (err) {
  console.error("WordCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:failed", error: String(err) }, "*");
  }
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;

  if (data.type === "wordcraft:trigger-save") {
    const canvas = document.getElementById("wordcraft_canvas") || document.querySelector("canvas");
    if (canvas) {
      const sOpts = { key: "s", code: "KeyS", keyCode: 83, which: 83, ctrlKey: true, bubbles: true, cancelable: true };
      canvas.dispatchEvent(new KeyboardEvent("keydown", sOpts));
      canvas.dispatchEvent(new KeyboardEvent("keyup", sOpts));
    }
    return;
  }

  if (data.type === "wordcraft:exit-backstage") {
    // If user clicks "Show Document", click back button '<' or Blank Document
    clickCanvas(20, 25);
    setTimeout(() => clickCanvas(147, 170), 100);
    return;
  }

  if (data.type && (data.type === "wordcraft:open" || data.type.endsWith(":open"))) {
    const docName = data.name || "Document.docx";
    const bytes = data.bytes;

    if (bytes && bytes.byteLength > 0) {
      const ext = docName.split(".").pop()?.toLowerCase() || "docx";
      const mime = ext === "md" || ext === "txt"
        ? "text/plain"
        : "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

      pendingFile = new File([bytes], docName, { type: mime, lastModified: Date.now() });
      hasLoadedDocument = false;

      if (openSeqTimer) clearTimeout(openSeqTimer);
      if (retrySeqTimer) clearTimeout(retrySeqTimer);

      function triggerOpenSequence() {
        if (hasLoadedDocument) return;
        // 1. If currently in canvas, click File (x=16, y=48) to open Backstage
        clickCanvas(16, 48);
        setTimeout(() => {
          if (hasLoadedDocument) return;
          // 2. In Backstage sidebar, click Open (x=40, y=154)
          clickCanvas(40, 154);
          setTimeout(() => {
            if (hasLoadedDocument) return;
            // 3. On Open view, click Browse... (x=135, y=88) -> triggers rfd -> intercepted by our hook!
            clickCanvas(135, 88);
          }, 120);
        }, 100);
      }

      openSeqTimer = setTimeout(triggerOpenSequence, 350);
      retrySeqTimer = setTimeout(() => {
        if (!hasLoadedDocument) triggerOpenSequence();
      }, 1200);
    } else {
      // New / Blank Document -> Click Blank document card at (x=147, y=170)
      function triggerBlankSequence() {
        if (hasLoadedDocument) return;
        clickCanvas(147, 170);
        hasLoadedDocument = true;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "wordcraft:document-ready" }, "*");
        }
      }
      setTimeout(triggerBlankSequence, 400);
    }
  }
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { display: none; }
  </style>
<link rel="modulepreload" href="./wordcraft-web-9e321acdac2ac7dc.js" crossorigin="anonymous" integrity="sha384-WI5Sf1J2izS//U2p4CpSInvDHOKtUdltA3wyTR15B9DFUnjT/LLb5xBsaIhduMOP"><link rel="preload" href="./wordcraft-web-9e321acdac2ac7dc_bg.wasm" crossorigin="anonymous" integrity="sha384-cyZtd13dLos9BjlXaCIPFk9T7XqvyeLAkIgI3ms3zV+erj6PyDEueNl8LIo/YOD2" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
