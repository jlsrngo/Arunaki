<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import init, * as bindings from './wordcraft-web-9e321acdac2ac7dc.js';
try {
  const wasm = await init({ module_or_path: './wordcraft-web-9e321acdac2ac7dc_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:ready" }, "*");
  }
} catch (err) {
  console.error("WordCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:failed", error: String(err) }, "*");
  }
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;

  function exitBackstage() {
    const canvas = document.getElementById("wordcraft_canvas") || document.querySelector("canvas");
    const targets = [canvas, window, document].filter(Boolean);
    const escOpts = { key: "Escape", code: "Escape", keyCode: 27, which: 27, bubbles: true, cancelable: true };
    for (const target of targets) {
      try {
        target.dispatchEvent(new KeyboardEvent("keydown", escOpts));
        target.dispatchEvent(new KeyboardEvent("keyup", escOpts));
      } catch (_) {}
    }
    // Also dispatch click on "<" button (approx x=28, y=28)
    if (canvas) {
      try {
        const backClick = new MouseEvent("click", { clientX: 28, clientY: 28, bubbles: true, cancelable: true });
        canvas.dispatchEvent(backClick);
      } catch (_) {}
    }
  }

  if (data.type === "wordcraft:exit-backstage") {
    exitBackstage();
    return;
  }

  if (data.type && (data.type === "wordcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
      const blob = new Blob([data.bytes], { type: mime });
      const file = new File([blob], data.name || "Document.docx", { type: mime, lastModified: Date.now() });
      const dt = new DataTransfer();
      dt.items.add(file);

      const midX = Math.floor(window.innerWidth / 2) || 400;
      const midY = Math.floor(window.innerHeight / 2) || 300;

      function dispatchDrop() {
        const canvas = document.getElementById("wordcraft_canvas") || document.querySelector("canvas");
        const targets = [canvas, document, window].filter(Boolean);
        for (const target of targets) {
          try {
            const dragEnter = new DragEvent("dragenter", { bubbles: true, cancelable: true, dataTransfer: dt, clientX: midX, clientY: midY });
            target.dispatchEvent(dragEnter);

            const dragOver = new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt, clientX: midX, clientY: midY });
            target.dispatchEvent(dragOver);

            const dropEvt = new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt, clientX: midX, clientY: midY });
            target.dispatchEvent(dropEvt);
          } catch (e) {
            console.warn("[WordCraft] drop dispatch error:", e);
          }
        }
      }

      // 1. Dispatch drop into canvas center
      dispatchDrop();
      setTimeout(dispatchDrop, 150);
      setTimeout(dispatchDrop, 400);

      // 2. Automatically exit Backstage so document view is immediately visible
      setTimeout(exitBackstage, 250);
      setTimeout(exitBackstage, 600);
      setTimeout(exitBackstage, 1200);
    } catch (err) {
      console.warn("[WordCraft] Drop packaging error:", err);
    }
  }
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>

<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
