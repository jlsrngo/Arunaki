<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import init, * as bindings from './wordcraft-web-9e321acdac2ac7dc.js';
try {
  const wasm = await init({ module_or_path: './wordcraft-web-9e321acdac2ac7dc_bg.wasm' });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:ready" }, "*");
  }
} catch (err) {
  console.error("WordCraft WASM init error:", err);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "wordcraft:failed", error: String(err) }, "*");
  }
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || typeof data !== "object") return;
  if (data.type && (data.type === "wordcraft:open" || data.type.endsWith(":open")) && data.bytes) {
    try {
      const blob = new Blob([data.bytes], { type: "application/octet-stream" });
      const file = new File([blob], data.name || "Document.docx", { type: "application/octet-stream" });
      const dt = new DataTransfer();
      dt.items.add(file);
      const canvas = document.getElementById("wordcraft_canvas") || document.querySelector("canvas");
      const target = canvas || window;
      target.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: dt }));
      target.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
    } catch (err) {
      console.warn("[WordCraft] Drop dispatch error:", err);
    }
  }
});
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./wordcraft-web-9e321acdac2ac7dc.js" crossorigin="anonymous" integrity="sha384-WI5Sf1J2izS//U2p4CpSInvDHOKtUdltA3wyTR15B9DFUnjT/LLb5xBsaIhduMOP"><link rel="preload" href="./wordcraft-web-9e321acdac2ac7dc_bg.wasm" crossorigin="anonymous" integrity="sha384-cyZtd13dLos9BjlXaCIPFk9T7XqvyeLAkIgI3ms3zV+erj6PyDEueNl8LIo/YOD2" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
